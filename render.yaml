# Blueprint Render — Phase pilote « pleine puissance »
# Sur Render : New → Blueprint → Blueprint Path = render.yaml
# OU : synchro sur le service existant après push.

databases:
  - name: auta-gestion-db
    # Free = OK pilote (expire ~30j). Passer basic-256mb + carte CB pour prod durable.
    plan: free
    region: frankfurt

services:
  - type: web
    name: auta-gestion-api
    runtime: python
    # Free = cold start. Passer starter + carte CB pour always-on.
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_OPEN_REGISTRATION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: auta-gestion-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/auta-uploads
      - key: CORS_ORIGINS
        value: "https://reeegency-hub.github.io,https://reeegency-hub.github.io/auta-gestion"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # À renseigner manuellement dans le dashboard Render (ne pas committer la clé) :
      # GROK_API_KEY, GROK_BASE_URL=https://api.x.ai/v1, GROK_MODEL=grok-3-mini
      # Puis plus tard : SMTP_*, S3_*
