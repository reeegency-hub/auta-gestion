# Blueprint Render — fichier à la RACINE du repo, nommé exactement : render.yaml
# Sur Render : New → Blueprint → Blueprint Path = render.yaml (pas AUTA.GESTION)

services:
  - type: web
    name: auta-gestion-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_OPEN_REGISTRATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/auta.db
      - key: UPLOAD_DIR
        value: /tmp/auta-uploads
      - key: CORS_ORIGINS
        value: "https://reeegency-hub.github.io,https://reeegency-hub.github.io/auta-gestion"
      - key: PYTHON_VERSION
        value: "3.11.9"
