# Déploiement Render.com (API) — gratuit pour démarrer
# 1. Connecte le repo GitHub sur https://render.com
# 2. Ce fichier crée l’API + Postgres
# 3. Mets à jour VITE_API_URL dans le workflow GitHub Pages avec l’URL Render

databases:
  - name: auta-db
    plan: free

services:
  - type: web
    name: auta-gestion-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_OPEN_REGISTRATION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/auta-uploads
      - key: PYTHON_VERSION
        value: "3.11.9"
